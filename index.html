<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GiocoLegami">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GiocoLegami</title>
<meta name="description" content="Scopri i collegamenti tra i videogiochi: studi di sviluppo, editori e generi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1512;--card:#15211d;--fg:#f3efdc;--mut:#9fb2a8;--bd:#2a3b34;--film:#BC4B51;--film-t:#E8858A;--dir:#5B8E7D;--dir-t:#93cbb8;--act:#F4A259;--gen:#8CB369;--hl:#8CB369;--acc:#F4E285;--edge:#3f564b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-family:Cinzel,"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:800;font-size:3rem;letter-spacing:.07em;text-align:center;color:var(--acc);text-shadow:0 0 22px rgba(244,226,133,.28);margin:6px 0 4px}
h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:1.2rem;margin:26px 0 6px}
p.sub{margin:0 0 18px;color:var(--mut);text-align:center}
h2+p.sub,#p p.sub{text-align:left}
a{color:var(--dir-t)}
input{flex:1;min-width:0;width:100%;font:inherit;padding:13px 16px;border:2px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--dir);outline-offset:2px}
.row{display:flex;gap:8px}
.go{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:999px;background:var(--film);color:#fff;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
#msg{color:var(--mut);min-height:1.4em;font-size:.9rem;margin:6px 4px 0}
.box{border:1px solid var(--bd);border-radius:16px;margin-top:12px;overflow-x:auto;background:#0a110f}
svg{width:100%;min-width:760px;height:auto;display:block}
svg text{fill:var(--fg);font-size:17px;paint-order:stroke;stroke:#0a110f;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
svg text.in{fill:#14251f;stroke:none;font-size:14px;font-weight:700}
svg text.in.f{fill:#fff}
.n{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s}
.n[data-e]:focus-visible{transform:scale(2.6)}
.n[data-f]:focus-visible{transform:scale(2.2)}
@media(hover:hover){.n[data-e]:hover{transform:scale(2.6)}
.n[data-f]:hover{transform:scale(2.2)}}
.n:hover,.n:focus-visible{opacity:1!important}
.lb{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s}
.n:hover + .lb,.n:focus-visible + .lb{transform:translate(var(--sx,0px),var(--sy,0px));opacity:1}
@media(prefers-reduced-motion:reduce){.n,.lb{transition:none}}
.n.on{filter:drop-shadow(0 0 9px var(--hl))}
.n.ctr{cursor:default;filter:drop-shadow(0 0 18px rgba(244,226,133,.38))}
.n.ctr:hover{transform:none}
g[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:4px;border-radius:8px}
@media(prefers-reduced-motion:no-preference){
.a .n{animation:pop .5s ease-out backwards;animation-delay:calc(var(--i) * 45ms)}
.a .e{stroke-dasharray:1;animation:draw .8s ease-out backwards;animation-delay:calc(var(--i) * 30ms)}
.ef{pointer-events:none;stroke-dasharray:.07 .93;animation:flow 3.4s linear infinite backwards;animation-delay:calc(1.4s + var(--i) * 260ms)}
.ef.on{stroke-dasharray:.1 .9;animation-duration:1.9s}
@keyframes flow{from{stroke-dashoffset:.07}to{stroke-dashoffset:-1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes draw{from{stroke-dashoffset:1}}}
.cap{margin:10px 2px 0;font-size:1rem}
.n.tap{filter:drop-shadow(0 0 8px var(--acc))}
@media(max-width:700px){
main{padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
h1{font-size:2.1rem;letter-spacing:.05em}
.box{overflow:hidden}
svg{min-width:0}
svg .ttl{display:none}
svg .lb{display:none}
.n[data-e]{transform:scale(1.3)}
.n[data-f]{transform:scale(1.2)}
.n.ctr{transform:scale(1.1)}
.leg{gap:8px 14px;font-size:.8rem}
.pc{width:118px}.pc img,.pc .ph{width:118px;height:167px}
li{gap:10px}
.go{padding:0 18px}
}
.leg{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--mut);margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg svg{width:26px;min-width:0;display:inline-block}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--film);border-radius:16px;padding:16px;margin-top:18px}
.card.p{border-left-color:var(--dir)}.card.p.pub{border-left-color:var(--act)}.card.p.gen{border-left-color:var(--gen)}
.hd{display:flex;gap:14px;align-items:center}
.hd>div{min-width:0}
.hd h2{margin:0}
.k{color:var(--mut);font-size:.82rem;margin:14px 0 2px}
.ov{margin:10px 0 0;font-size:.92rem}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--acc);color:#3b3510;font-size:.8rem;font-weight:600;margin:4px 6px 0 0}
.tag.sim{background:none;color:var(--acc);border:1px dashed var(--acc)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
li>div{min-width:0}
.fa{flex:none;display:grid;place-items:center;width:40px;height:56px;border-radius:6px;color:#fff;background:var(--film);font-size:.8rem;font-weight:700;object-fit:cover}
.fa.big{width:66px;height:94px;font-size:1rem}
.pa{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#14251f;font-size:.62rem;font-weight:700;margin-right:6px;object-fit:contain;background:#f3efdc;border:2px solid var(--dir);flex:none}
.pa.ini{background:var(--dir)}
.pa.pub{border-color:var(--act)}.pa.pub.ini{background:var(--act)}
.pa.gen{border-color:var(--gen);background:var(--gen);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border-radius:0}
.pa.big{width:68px;height:68px;font-size:1rem;margin:0;border-width:3px;padding:6px}
.pa.big.ini,.pa.big.gen{padding:0}
.pa svg{width:72%;height:72%;min-width:0;display:block}
.chip{display:inline-flex;align-items:center;margin:4px 8px 0 0;padding:2px 12px 2px 2px;border:1px solid var(--bd);border-radius:999px;background:var(--card);font:inherit;font-size:.85rem;color:var(--fg);cursor:pointer;text-align:left}
.chip .po{width:22px;height:31px;border-radius:4px;object-fit:cover;margin:2px 8px 2px 2px}
.chip:not(:has(.pa)):not(:has(.po)){padding-left:12px}
button.l{font:inherit;font-weight:600;font-size:1rem;color:var(--film-t);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.rail{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity;scrollbar-color:var(--bd) transparent}
.pc{flex:none;width:132px;background:none;border:0;padding:0;text-align:left;color:var(--fg);font:inherit;cursor:pointer;scroll-snap-align:start}
.pc img,.pc .ph{display:block;width:132px;height:187px;border-radius:8px;object-fit:cover;background:var(--card);border:1px solid var(--bd);transition:transform .2s,box-shadow .2s}
.pc:hover img,.pc:focus-visible img{transform:translateY(-5px);box-shadow:0 10px 24px rgba(0,0,0,.55),0 0 0 2px var(--acc)}
.pt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font-size:.85rem;font-weight:600;line-height:1.3}
.pd{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}
@media(prefers-reduced-motion:reduce){.pc img{transition:none}}
.note{margin-top:28px;font-size:.82rem;color:var(--mut)}
.link{font:inherit;font-size:.82rem;color:var(--dir-t);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main>
<h1>GiocoLegami</h1>
<p class="sub">Scopri i collegamenti tra i videogiochi</p>
<div class="row"><input id="q" placeholder="Scrivi il titolo di un videogioco" autocomplete="off" aria-label="Titolo del videogioco"><button id="go" class="go" type="button">Cerca</button></div>
<p id="msg" role="status" aria-live="polite"></p>
<div id="res"></div>
<section id="home" hidden>
<h2>Usciti di recente</h2><div id="now" class="rail"></div>
<h2>In arrivo</h2><div id="soon" class="rail"></div>
</section>
<div id="film" hidden>
<button id="back" class="link" type="button">← Novità</button>
<div class="box"><svg id="g" viewBox="0 0 980 660" role="img" aria-label="Grafo dei collegamenti"></svg></div>
<p id="cap" class="cap" hidden></p>
<div class="leg">
<span><b class="pa ini" style="width:14px;height:14px;margin:0"></b>Studio di sviluppo</span>
<span><b class="pa pub ini" style="width:14px;height:14px;margin:0"></b>Editore</span>
<span><b class="pa gen" style="width:15px;height:15px;margin:0"></b>Genere</span>
<span><svg width="26" height="8" style="min-width:0" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="#F4E285" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/></svg>Simile secondo IGDB</span>
</div>
<div id="info"></div>
<div id="p"></div>
</div>
<p class="note">Dati e immagini forniti da <a href="https://www.igdb.com" target="_blank" rel="noopener">IGDB.com</a>. Le trame e le descrizioni sono in inglese, come nel database.</p>
</main>
<script>
const MOB=()=>window.matchMedia&&matchMedia("(max-width:700px)").matches;
const $=i=>document.getElementById(i),PI=Math.PI,CX=490,CY=330;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Indirizzo del servizio Cloudflare che nasconde le credenziali di IGDB
const API="https://giocolegami.mariomautone1.workers.dev";
const NOW=Math.floor(Date.now()/1000),DAY=86400;
let aT=0,cur=null,sel=null,tok=0,last=0;
const cache=new Map();
async function api(ep,body){
const ck=ep+"|"+body;if(cache.has(ck))return cache.get(ck);
const wait=Math.max(0,last+270-Date.now());last=Date.now()+wait;if(wait)await new Promise(r=>setTimeout(r,wait));
const r=await fetch(API+"/"+ep,{method:"POST",body});
if(r.status===429)throw{code:"rate"};
if(!r.ok)throw{code:"http",status:r.status};
const j=await r.json();cache.set(ck,j);return j}
async function tryApi(ep,bodies){let err;for(const b of bodies){try{return await api(ep,b)}catch(e){err=e;if(e.code!=="http"||e.status!==400)break}}throw err}
const cov=(id,s)=>`https://images.igdb.com/igdb/image/upload/t_${s}/${id}.jpg`;
const logo=id=>`https://images.igdb.com/igdb/image/upload/t_logo_med/${id}.png`;
const yr=f=>f.first_release_date?String(new Date(f.first_release_date*1000).getUTCFullYear()):"";
const cv=f=>f.cover&&f.cover.image_id||"";
const ST=new Set("il lo la le i gli un una di a the of and e".split(" "));
const ini=s=>{const w=String(s).replace(/[:.,'’&()\[\]-]/g," ").split(/\s+/).filter(Boolean),b=w.filter(x=>!ST.has(x.toLowerCase())),u=b.length?b:w;if(!u.length)return"?";return(u.length>1?u[0][0]+u[u.length-1][0]:u[0].slice(0,2)).toUpperCase()};
const ecn=e=>e.k==="g"?"gen":e.role==="Editore"?"act":"dir";
const ecl=e=>e.k==="g"?"gen":e.role==="Editore"?"pub":"";
const setMsg=t=>{$("msg").textContent=t||""};
const tags=a=>a.filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
const pa=(e,big)=>{const c="pa "+ecl(e)+(big?" big":"");if(e.k==="g")return `<b class="${c}"><svg viewBox="-10 -10 20 20" aria-hidden="true">${gIcon(e.id)}</svg></b>`;return e.logo?`<img class="${c}" src="${logo(e.logo)}" alt="">`:`<b class="${c} ini">${esc(ini(e.name))}</b>`};
const ch=e=>`<button class="chip" data-e="${e.key}">${pa(e)}${esc(e.name)}</button>`;
const fc=f=>`<button class="chip" data-f="${f.id}">${cv(f)?`<img class="po" src="${cov(cv(f),"cover_small")}" alt="">`:""}${esc(f.name)}${yr(f)?" ("+yr(f)+")":""}</button>`;
const poster=(id,t,big)=>id?`<img class="fa${big?" big":""}" src="${cov(id,big?"cover_big":"cover_small")}" alt="">`:`<span class="fa${big?" big":""}">${esc(ini(t))}</span>`;
const cut=(s,n)=>s&&s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":(s||"");

function showErr(e){
const c=e&&e.code;
if(c==="rate")setMsg("Troppe richieste in poco tempo: riprova tra qualche secondo.");
else if(c==="http")setMsg("Il database non ha risposto correttamente. Riprova.");
else setMsg("Connessione non riuscita. Controlla internet e riprova.")}

const GF="name,cover.image_id,first_release_date,total_rating_count";
async function loadGame(id){
const my=++tok;setMsg("Carico il gioco…");
try{
const base="name,first_release_date,summary,total_rating,cover.image_id,genres.name,involved_companies.developer,involved_companies.publisher,involved_companies.company.name";
const r=await tryApi("games",[
`fields ${base},involved_companies.company.logo.image_id,similar_games.${GF.split(",").join(",similar_games.")}; where id = ${id};`,
`fields ${base},similar_games.${GF.split(",").join(",similar_games.")}; where id = ${id};`,
`fields ${base}; where id = ${id};`]);
const d=r[0];if(!d)throw{code:"http"};
// case: prima gli studi, poi gli editori; al massimo 4. Generi: al massimo 3.
const cm=new Map();
(d.involved_companies||[]).forEach(ic=>{const c=ic.company;if(!c||!c.id)return;
const m=cm.get(c.id)||{id:c.id,name:c.name,logo:c.logo&&c.logo.image_id,dev:false,pub:false};
m.dev=m.dev||!!ic.developer;m.pub=m.pub||!!ic.publisher;cm.set(c.id,m)});
const comps=[...cm.values()].filter(c=>c.dev||c.pub).sort((a,b)=>(b.dev-a.dev)||(a.pub-b.pub)).slice(0,4)
.map(c=>({key:"c"+c.id,id:c.id,k:"c",name:c.name,logo:c.logo,role:c.dev&&c.pub?"Studio ed editore":c.dev?"Studio":"Editore"}));
const gens=(d.genres||[]).slice(0,3).map(g=>({key:"g"+g.id,id:g.id,k:"g",name:g.name,role:"Genere"}));
const E=[...comps,...gens],gids=gens.map(g=>g.id);
const res=await Promise.all(E.map(e=>e.k==="c"
?api("companies",`fields description,developed.${GF.split(",").join(",developed.")},published.${GF.split(",").join(",published.")}; where id = ${e.id};`).catch(()=>null)
:api("games",`fields ${GF},genres; where genres = (${e.id}) & id != ${d.id} & version_parent = null & cover != null & total_rating_count > 15; sort total_rating_count desc; limit 40;`).catch(()=>null)));
if(my!==tok)return;
const known={},L=new Map();
const link=(f,key,sim)=>{const o=L.get(f.id)||{f,who:[],sim:false};if(key&&!o.who.includes(key))o.who.push(key);if(sim)o.sim=true;L.set(f.id,o)};
E.forEach((e,i)=>{const x=res[i];let list=[];
if(e.k==="c"&&x&&x[0]){e.desc=x[0].description||"";const m=new Map();[...(x[0].developed||[]),...(x[0].published||[])].forEach(f=>{if(f&&f.id!==d.id&&f.name)m.set(f.id,f)});
list=[...m.values()].sort((a,b)=>(b.total_rating_count||0)-(a.total_rating_count||0)).slice(0,12)}
if(e.k==="g"&&Array.isArray(x)){const sh=f=>(f.genres||[]).filter(g=>gids.includes(g)).length;list=x.slice().sort((a,b)=>sh(b)-sh(a)||(b.total_rating_count||0)-(a.total_rating_count||0)).slice(0,12)}
known[e.key]=list;list.slice(0,e.k==="c"?8:6).forEach(f=>link(f,e.key))});
const sims=(d.similar_games||[]).filter(f=>f&&f.name);
sims.slice(0,6).forEach(f=>link(f,null,true));
cur={id:d.id,title:d.name,year:yr(d),rating:d.total_rating?Math.round(d.total_rating):0,summary:d.summary,cover:cv(d),E,known,sims,links:[...L.values()]};
sel=null;$("q").value=d.name;setMsg("");show("film");R(true);
try{history.replaceState(null,"","#g"+d.id)}catch(e){}
}catch(e){if(my===tok)showErr(e)}}

const show=v=>{$("home").hidden=v!=="home";$("film").hidden=v!=="film"};
const fmtD=t=>new Date(t*1000).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const pc=(f,soon)=>`<button class="pc" data-f="${f.id}"><img src="${cov(cv(f),"cover_big")}" alt="" loading="lazy"><span class="pt">${esc(f.name)}</span><span class="pd">${f.first_release_date?(soon?"dal ":"uscito il ")+esc(fmtD(f.first_release_date)):""}</span></button>`;
async function loadHome(){
setMsg("Carico le novità…");
try{const F="name,cover.image_id,first_release_date";
let[n,u]=await Promise.all([
api("games",`fields ${F}; where first_release_date >= ${NOW-60*DAY} & first_release_date <= ${NOW} & cover != null & version_parent = null & hypes > 3; sort first_release_date desc; limit 20;`),
api("games",`fields ${F}; where first_release_date > ${NOW} & first_release_date < ${NOW+240*DAY} & cover != null & version_parent = null & hypes > 5; sort first_release_date asc; limit 20;`)]);
if(n.length<6)n=await api("games",`fields ${F}; where first_release_date >= ${NOW-60*DAY} & first_release_date <= ${NOW} & cover != null & version_parent = null & hypes > 0; sort first_release_date desc; limit 20;`);
$("now").innerHTML=n.map(f=>pc(f,false)).join("")||"<p class=\"sub\">Nessun gioco trovato.</p>";
$("soon").innerHTML=u.map(f=>pc(f,true)).join("")||"<p class=\"sub\">Nessuna uscita in programma trovata.</p>";
setMsg("");
}catch(e){if(!cur){setMsg("");startDefault()}else setMsg("Le novità non sono disponibili al momento.")}}
async function startDefault(){try{const r=await api("games",'search "Elden Ring"; fields name; where version_parent = null; limit 1;');if(r[0])loadGame(r[0].id)}catch(e){showErr(e)}}

// icone dei generi IGDB (per numero di genere; se manca, un'etichetta)
const S=d=>`<path d="${d}" fill="none" stroke="#14251f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`,F=d=>`<path d="${d}" fill="#14251f"/>`,O=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#14251f"/>`;
const RING="M0 -7.5A7.5 7.5 0 1 1 0 7.5A7.5 7.5 0 1 1 0 -7.5";
const burst=[...Array(16)].map((_,k)=>{const a=-PI/2+k*PI/8,r=k%2?3.6:8.5;return(r*Math.cos(a)).toFixed(1)+" "+(r*Math.sin(a)).toFixed(1)}).join("L");
const ROOK="M-6 8V5H-4V-2H-6V-7H-3.5V-5H-1.2V-7H1.2V-5H3.5V-7H6V-2H4V5H6V8Z";
const GIC={
rpg:S("M7 -7L-3 3M7 -7H3.5M7 -7V-3.5M-6.5 -0.5L0.5 6.5M-3 3L-7.5 7.5"),
adv:S(RING)+F("M3.6 -3.6L1.2 1.2L-3.6 3.6L-1.2 -1.2Z"),
sho:S("M0 -6.5A6.5 6.5 0 1 1 0 6.5A6.5 6.5 0 1 1 0 -6.5M0 -9.5V-3.5M0 3.5V9.5M-9.5 0H-3.5M3.5 0H9.5")+O(0,0,1.3),
pla:F("M-8.5 8.5V3.5H-3V-1.5H2.5V-6.5H8.5V8.5Z")+O(-5,-4.5,2),
puz:F("M-6.5 -6H-2A2.2 2.2 0 1 1 2 -6H6.5V-2A2.2 2.2 0 1 0 6.5 2V7H-6.5Z"),
rac:S("M-6.5 9V-8.5")+F("M-6.5 -8.5H7V0.5H-6.5Z")+`<path d="M-3.1 -8.5h3.4v4.5h-3.4zM3.6 -8.5h3.4v4.5h-3.4zM-6.5 -4h3.4v4.5h-3.4zM0.3 -4h3.4v4.5h-3.4z" fill="var(--gen)"/>`,
str:F(ROOK),
sim:S("M0 -4.5A4.5 4.5 0 1 1 0 4.5A4.5 4.5 0 1 1 0 -4.5"+[...Array(8)].map((_,k)=>{const a=k*PI/4;return`M${(5.5*Math.cos(a)).toFixed(1)} ${(5.5*Math.sin(a)).toFixed(1)}L${(8.5*Math.cos(a)).toFixed(1)} ${(8.5*Math.sin(a)).toFixed(1)}`}).join(""))+O(0,0,1.6),
spo:S(RING+"M-7.5 0H7.5M0 -7.5C-4 -4 -4 4 0 7.5M0 -7.5C4 -4 4 4 0 7.5"),
fig:F("M"+burst+"Z"),
hac:S("M-7 -7L5 5M7 -7L-5 5M2.5 7.5L7.5 2.5M-2.5 7.5L-7.5 2.5"),
mus:O(-3,5,3.2)+S("M0 5V-8L6.5 -6"),
poi:F("M-5 -8.5L5.5 2H0.8L3.4 7.6L1.2 8.6L-1.4 3L-5 6.6Z"),
ind:F("M0 7.5C-8.5 1.5 -8.5 -6.5 -3.8 -6.5C-1.8 -6.5 0 -5 0 -3.2C0 -5 1.8 -6.5 3.8 -6.5C8.5 -6.5 8.5 1.5 0 7.5Z"),
arc:F("M-7.5 4H7.5V8.5H-7.5Z")+S("M0 4V-3")+O(0,-5,3.2),
vno:S("M0 -5C-3 -7 -6 -7 -8.5 -6V6C-6 5 -3 5 0 7C3 5 6 5 8.5 6V-6C6 -7 3 -7 0 -5V7"),
car:S("M-5.5 -7H5.5A1.5 1.5 0 0 1 7 -5.5V5.5A1.5 1.5 0 0 1 5.5 7H-5.5A1.5 1.5 0 0 1 -7 5.5V-5.5A1.5 1.5 0 0 1 -5.5 -7Z")+O(-3,-3,1.5)+O(0,0,1.5)+O(3,3,1.5),
mob:F("M0 -8.5L7 -5.5V0C7 4 4 7 0 8.5C-4 7 -7 4 -7 0V-5.5Z"),
qui:S("M-3.5 -4A3.6 3.6 0 1 1 1.2 -0.6C0.2 0 0 1 0 2.6")+O(0,6.4,1.4),
pin:O(3,-4,3)+S("M-7.5 6.5L1.5 3.5M7.5 6.5"),
tag:F("M-7 -7H0.5L7.5 0L0 7.5L-7 0.5Z")+`<circle cx="-3.3" cy="-3.3" r="1.7" fill="var(--gen)"/>`};
const GID={2:"poi",4:"fig",5:"sho",7:"mus",8:"pla",9:"puz",10:"rac",11:"str",12:"rpg",13:"sim",14:"spo",15:"str",16:"str",24:"str",25:"hac",26:"qui",30:"pin",31:"adv",32:"ind",33:"arc",34:"vno",35:"car",36:"mob"};
const gIcon=id=>GIC[GID[id]]||GIC.tag;
const lay=(a,r)=>[CX+r*Math.cos(a),CY+r*Math.sin(a)];
function lab(p,txt,off,bold,dim,ex,ey,sl){const dx=p[0]-CX,dy=p[1]-CY,m=Math.abs(dx)<30;
const sx=m?0:(dx>0?1:-1)*Math.max(0,Math.round((ex||0)+10-off)),sy=m?(dy>0?1:-1)*Math.max(0,Math.round((ey||0)+8-off)):0;
return `<text class="lb${sl?" sel":""}" style="--sx:${sx}px;--sy:${sy}px" x="${(p[0]+(m?0:dx>0?off:-off)).toFixed(1)}" y="${(p[1]+(m?(dy>0?off+16:-off):6)).toFixed(1)}" text-anchor="${m?"middle":dx>0?"start":"end"}"${bold?' font-weight="700"':""}${dim?' opacity=".4"':""}>${esc(cut(txt,26))}</text>`}
// icone dei badge: codice (studio), scatola (editore), etichetta (genere), joypad (gioco)
const IC={
dir:`<path d="M-3 -5L-7.5 0L-3 5M3 -5L7.5 0L3 5" fill="none" stroke="#0a110f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`,
act:`<path d="M-6 -2.5L0 -6L6 -2.5L6 4L0 7.5L-6 4Z" fill="#0a110f"/><path d="M-6 -2.5L0 1L6 -2.5M0 1V7.5" fill="none" stroke="var(--act)" stroke-width="1.3" stroke-linejoin="round"/>`,
gen:`<path d="M-6.5 -6.5H0.5L7 0L0 7L-6.5 0.5Z" fill="#0a110f" stroke-linejoin="round"/><circle cx="-3" cy="-3" r="1.6" fill="var(--gen)"/>`,
film:`<rect x="-8" y="-4.5" width="16" height="9" rx="4.5" fill="#0a110f"/><path d="M-5.3 0h3.6M-3.5 -1.8v3.6" stroke="var(--film)" stroke-width="1.4"/><circle cx="3" cy="-0.9" r="1.1" fill="var(--film)"/><circle cx="5.1" cy="1.2" r="1.1" fill="var(--film)"/>`};
const bdg=(x,y,c,r)=>`<g class="bd" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(r/12).toFixed(2)})"><circle r="12" fill="var(--${c})" stroke="#0a110f" stroke-width="2"/>${IC[c]}</g>`;
const hx=(x,y,R)=>[0,1,2,3,4,5].map(k=>(x+R*Math.cos(PI/6+k*PI/3)).toFixed(1)+","+(y+R*Math.sin(PI/6+k*PI/3)).toFixed(1)).join(" ");
function pn(e,q,i){const G=e.k==="g",on=e.key===sel,r=on?31:26,id="ce"+i,R=G?r*1.18:r,c=`var(--${ecn(e)})`;
const shp=at=>G?`<polygon points="${hx(q[0],q[1],R)}" ${at}/>`:`<circle cx="${q[0]}" cy="${q[1]}" r="${r}" ${at}/>`;
const inner=e.logo&&!G?`<clipPath id="${id}">${shp("")}</clipPath>${shp('fill="#f3efdc"')}<image href="${logo(e.logo)}" x="${(q[0]-R*.7).toFixed(1)}" y="${(q[1]-R*.7).toFixed(1)}" width="${(R*1.4).toFixed(1)}" height="${(R*1.4).toFixed(1)}" preserveAspectRatio="xMidYMid meet" clip-path="url(#${id})"/>`:G?`<g transform="translate(${q[0].toFixed(1)} ${q[1].toFixed(1)}) scale(${(R/11.5).toFixed(2)})">${gIcon(e.id)}</g>`:`<text class="in" x="${q[0]}" y="${q[1]+5}" text-anchor="middle">${esc(ini(e.name))}</text>`;
return `<g class="n${on?" on":""}" style="--i:${i}" data-e="${e.key}" tabindex="0" role="button" aria-label="${esc(e.name)}, ${esc(e.role.toLowerCase())}"><title>${esc(e.name)} (${esc(e.role.toLowerCase())})</title><circle cx="${q[0]}" cy="${q[1]}" r="${r+9}" fill="transparent"/>${shp(`fill="${c}"`)}${inner}${shp(`fill="none" stroke="${on?"var(--fg)":c}" stroke-width="4" stroke-linejoin="round"`)}${bdg(q[0]+R*.82,q[1]-R*.82,ecn(e),12)}</g>`}
function fn(f,q,k,go,i,x){x=x||{};const w=17*k,h=24*k,id="cf"+(go?f.id:"c"),c=cv(f);
const inner=c?`<clipPath id="${id}"><rect x="${q[0]-w}" y="${q[1]-h}" width="${2*w}" height="${2*h}" rx="6"/></clipPath><image href="${cov(c,"cover_big")}" x="${q[0]-w}" y="${q[1]-h}" width="${2*w}" height="${2*h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>`:`<text class="in f" x="${q[0]}" y="${q[1]+5}" text-anchor="middle">${esc(ini(f.name))}</text>`;
return `<g class="n${go?"":" ctr"}${x.on?" on":""}" style="--i:${i}${x.dim?";opacity:.35":""}" ${go?`data-f="${f.id}" tabindex="0" role="button" aria-label="${esc(f.name)}"`:""}><title>${esc(f.name)}${yr(f)?" ("+yr(f)+")":""}${x.names?", in comune: "+esc(x.names):""}${x.sim?" (simile secondo IGDB)":""}</title>${go?`<rect x="${q[0]-w-8}" y="${q[1]-h-8}" width="${2*w+16}" height="${2*h+16}" fill="transparent"/>`:""}<rect x="${q[0]-w}" y="${q[1]-h}" width="${2*w}" height="${2*h}" rx="6" fill="var(--film)"/>${inner}<rect x="${q[0]-w}" y="${q[1]-h}" width="${2*w}" height="${2*h}" rx="6" fill="none" stroke="${x.on?"var(--hl)":"#0a110f"}" stroke-width="3"/>${bdg(q[0]+w*.9,q[1]-h*.9,"film",go?10:12)}</g>`}
const sortedLinks=()=>[...cur.links].sort((a,b)=>((b.who.includes(sel)?1:0)-(a.who.includes(sel)?1:0))||b.who.length-a.who.length||(b.sim-a.sim)||(b.f.total_rating_count||0)-(a.f.total_rating_count||0));
const DEFS=`<defs><radialGradient id="gl"><stop offset="0" stop-color="#F4E285" stop-opacity=".2"/><stop offset=".55" stop-color="#F4A259" stop-opacity=".06"/><stop offset="1" stop-color="#F4A259" stop-opacity="0"/></radialGradient></defs><circle cx="${CX}" cy="${CY}" r="330" fill="url(#gl)"/><circle cx="${CX}" cy="${CY}" r="125" fill="none" stroke="#2a3b34" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="${CX}" cy="${CY}" r="258" fill="none" stroke="#2a3b34" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>`;
const eg=(a,b,on,i,bend)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,qx=mx+(CX-mx)*bend,qy=my+(CY-my)*bend,d=`M${a[0].toFixed(1)} ${a[1].toFixed(1)}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`,hi=sel&&on;
return `<path class="e" pathLength="1" style="--i:${i}" d="${d}" fill="none" stroke="${hi?"var(--hl)":"var(--edge)"}" stroke-width="${hi?4:1.5}" stroke-linecap="round" opacity="${sel?(on?1:.18):.6}"/>`+(sel&&!on?"":`<path class="ef${hi?" on":""}" pathLength="1" style="--i:${i}" d="${d}" fill="none" stroke="${hi?"#fff":"var(--acc)"}" stroke-width="${hi?3:2.2}" stroke-linecap="round" opacity="${hi?.95:.8}"/>`)};
// collegamento "simile secondo IGDB": tratteggio dorato dal centro
const es=(a,b,dim)=>`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3 7" stroke-linecap="round" opacity="${dim?.15:.55}"/>`;

function R(first){
if(!cur)return;
const P=cur.E,n=P.length,L=sortedLinks(),Og=L.slice(0,12),pp={},fp={},c=[CX,CY];let s=DEFS,k=0;
P.forEach((e,i)=>pp[e.key]=lay(-PI/2+i*2*PI/Math.max(n,1),125));
Og.forEach((o,j)=>fp[o.f.id]=lay(-PI/2+(j+.5)*2*PI/Og.length,258));
P.forEach(e=>s+=eg(c,pp[e.key],e.key===sel,k++,0));
Og.forEach(o=>{if(!o.who.length)s+=es(c,fp[o.f.id],!!sel);o.who.forEach(key=>s+=eg(pp[key],fp[o.f.id],key===sel,k++,.22))});
P.forEach((e,i)=>{const rr=e.key===sel?31:26;s+='<g class="u">'+pn(e,pp[e.key],i)+lab(pp[e.key],e.name,36,e.key===sel,false,rr*2.6,rr*2.6,e.key===sel)+'</g>'});
Og.forEach((o,j)=>{const on=!!sel&&o.who.includes(sel),kk=Math.min(1.6,1+.2*Math.max(0,o.who.length-1)),names=o.who.map(key=>(P.find(x=>x.key===key)||{}).name).filter(Boolean).join(", ");
s+='<g class="u">'+fn(o.f,fp[o.f.id],kk,1,n+j,{on,dim:!!sel&&!on,names,sim:o.sim})+lab(fp[o.f.id],o.f.name,Math.round(12+24*kk),false,!!sel&&!on,17*kk*2.2,24*kk*2.2,on)+'</g>'});
s+=fn({name:cur.title,cover:{image_id:cur.cover}},c,1.7,0,0)+`<text class="ttl" x="28" y="46" font-weight="700" font-size="27">${esc(cut(cur.title,32))}</text>${cur.year?`<text class="ttl" x="28" y="72" font-size="18" style="fill:var(--mut)">${esc(cur.year)}</text>`:""}`;
$("g").setAttribute("class",first?"a":"");$("g").setAttribute("viewBox",MOB()?"180 20 620 620":"0 0 980 660");$("cap").hidden=true;
{const se=P.find(x=>x.key===sel);if(se&&MOB()){$("cap").innerHTML=`<b>${esc(se.name)}</b> (${esc(se.role.toLowerCase())}). Le linee verdi portano ai suoi giochi.`;$("cap").hidden=false}}
clearTimeout(aT);if(first)aT=setTimeout(()=>$("g").setAttribute("class",""),2300);
$("g").innerHTML=s;
const dev=P.filter(e=>e.k==="c"&&e.role!=="Editore"),pub=P.filter(e=>e.k==="c"&&e.role!=="Studio"),gen=P.filter(e=>e.k==="g");
let i=`<section class="card"><div class="hd">${poster(cur.cover,cur.title,1)}<div><h2>${esc(cur.title)}</h2>${tags([cur.year,cur.rating&&"Voto "+cur.rating+"/100",...gen.map(g=>g.name)])}</div></div>`+
(cur.summary?`<p class="ov">${esc(cut(cur.summary,320))}</p>`:"")+
(dev.length?`<div class="k">Sviluppo</div>${dev.map(ch).join("")}`:"")+
(pub.length?`<div class="k">Edizione</div>${pub.map(ch).join("")}`:"")+
(gen.length?`<div class="k">Genere</div>${gen.map(ch).join("")}`:"")+
(cur.sims.length?`<div class="k">Simili secondo IGDB</div><div>${cur.sims.slice(0,10).map(fc).join("")}</div>`:"")+
`<div class="k">Collegamenti</div>${tags([cur.links.length+" giochi collegati"])}</section>`;
const e=P.find(x=>x.key===sel);
if(e){const kn=cur.known[e.key]||[];
i=`<section class="card p ${ecl(e)}"><div class="hd">${pa(e,1)}<div><h2>${esc(e.name)}</h2>${tags([e.role])}</div></div>`+
(e.desc?`<p class="ov">${esc(cut(e.desc,320))}</p>`:"")+
`<div class="k">${e.k==="g"?"Giochi simili per tipologia":"Altri giochi di "+esc(e.name)}</div><div>${kn.slice(0,10).map(fc).join("")||"Nessun altro gioco trovato."}</div></section>`+i}
$("info").innerHTML=i;
$("p").innerHTML=`<h2>Giochi collegati a ${esc(cur.title)}</h2><ul>`+L.slice(0,24).map(o=>`<li>${poster(cv(o.f),o.f.name)}<div><button class="l" data-f="${o.f.id}">${esc(o.f.name)}${yr(o.f)?" ("+yr(o.f)+")":""}</button><div>${o.who.map(key=>{const q=P.find(x=>x.key===key);return q?ch(q):""}).join("")}${o.sim?'<span class="tag sim">Simile secondo IGDB</span>':""}</div></div></li>`).join("")+"</ul>"}

async function cerca(){
const v=$("q").value.trim();if(!v)return;
const b=$("go");b.disabled=true;setMsg("Cerco…");
try{const L=await api("games",`search "${v.replace(/["\\]/g," ")}"; fields name,first_release_date,cover.image_id; where version_parent = null; limit 8;`);
if(!L.length){setMsg("Nessun gioco trovato per «"+v+"».");$("res").innerHTML="";return}
$("res").innerHTML=L.length>1?`<div class="k">Intendevi un altro gioco?</div><div>${L.slice(1,6).map(fc).join("")}</div>`:"";
await loadGame(L[0].id)}catch(e){showErr(e)}finally{b.disabled=false}}

document.addEventListener("click",e=>{
const f=e.target.closest("[data-f]"),p=e.target.closest("[data-e]");
if(f&&MOB()&&f.closest("#g")&&!f.classList.contains("ctr")){const id=Number(f.dataset.f),o=sortedLinks().find(x=>x.f.id===id);
$("g").querySelectorAll(".tap").forEach(x=>{x.classList.remove("tap");if(x.nextElementSibling)x.nextElementSibling.classList.remove("sel")});
const lb=f.nextElementSibling;f.classList.add("tap");if(lb&&lb.classList)lb.classList.add("sel");
if(o){$("cap").innerHTML=`<b>${esc(o.f.name)}</b>${yr(o.f)?" ("+yr(o.f)+")":""} <button class="l" data-f="${id}" type="button">Apri questo gioco →</button>`;$("cap").hidden=false}}
else if(f){$("res").innerHTML="";loadGame(Number(f.dataset.f))}
else if(p){const k=p.dataset.e;sel=sel===k?null:k;R()}});
$("g").addEventListener("pointerover",e=>{const n=e.target.closest&&e.target.closest(".n");if(!n||n.classList.contains("ctr"))return;
if($("g").getAttribute("class"))$("g").setAttribute("class","");
const u=n.parentNode;if(u&&u.classList&&u.classList.contains("u")&&u.parentNode.lastElementChild!==u)u.parentNode.appendChild(u)});
$("g").addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-f],[data-e]");
if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const pe=t.dataset.e;t.dispatchEvent(new MouseEvent("click",{bubbles:true}));
if(pe){const nn=$("g").querySelector('[data-e="'+pe+'"]');if(nn)nn.focus()}}});
$("back").addEventListener("click",()=>{show("home");try{history.replaceState(null,"",location.pathname)}catch(e){}if(!$("now").innerHTML)loadHome()});
$("go").addEventListener("click",cerca);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")cerca()});
{const m=location.hash.match(/^#g(\d+)$/);if(m)loadGame(Number(m[1]));else{show("home");loadHome()}}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
